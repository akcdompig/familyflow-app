<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FamilyFlow</title><meta name="theme-color" content="#fff6ee"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FamilyFlow"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"><style>/* FamilyFlow designsysteem — palet "Zonsondergang".
   Alle kleuren, maten en bewegingen komen hier vandaan. Componenten gebruiken alleen deze variabelen. */
:root {
  /* Merk */
  --ff-koraal: #ff6b57;        /* merk, illustraties */
  --ff-koraal-knop: #d9442f;   /* knoppen met witte tekst (contrast > 4.5:1) */
  --ff-koraal-zacht: #ffe9e4;
  --ff-nacht: #23204a;         /* tekst, donkere vlakken */
  --ff-nacht-2: #3a3670;
  --ff-zon: #ffc845;           /* XP, beloningen */
  --ff-zon-zacht: #fff3d1;
  --ff-munt: #3cc6a0;          /* rust, gelukt */
  --ff-munt-donker: #1f6b57;
  --ff-munt-zacht: #e3f7f0;
  --ff-lucht: #6c8cff;         /* info, focus */
  --ff-lucht-donker: #3d52b8;
  --ff-lucht-zacht: #e8edff;

  /* Neutralen (licht warm, met een tik paars) */
  --ff-grond: #fff6ee;         /* achtergrond kind en huiskamer */
  --ff-wolk: #f4f3fb;          /* achtergrond ouder en coach */
  --ff-vlak: #ffffff;
  --ff-lijn: #ece4dc;
  --ff-tekst: var(--ff-nacht);
  --ff-tekst-zacht: #5f5b8a;

  /* Stemming (gezichtjes) */
  --ff-mood-1: #ffb09f;
  --ff-mood-2: #ffd3a8;
  --ff-mood-3: #ffe59a;
  --ff-mood-4: #a6ebd6;
  --ff-mood-5: #c9d4ff;
  --ff-mood-rust: #c9d4ff;

  /* Letters */
  --ff-font-speels: var(--font-fredoka, "Fredoka"), ui-rounded, "Nunito", system-ui, sans-serif;
  --ff-font-tekst: var(--font-jakarta, "Plus Jakarta Sans"), system-ui, -apple-system, "Segoe UI", sans-serif;
  --ff-t-xs: 0.78rem;
  --ff-t-s: 0.88rem;
  --ff-t-m: 1rem;
  --ff-t-l: 1.2rem;
  --ff-t-xl: 1.6rem;
  --ff-t-xxl: 2rem;

  /* Ruimte (4-puntsraster) */
  --ff-r1: 4px;
  --ff-r2: 8px;
  --ff-r3: 12px;
  --ff-r4: 16px;
  --ff-r5: 20px;
  --ff-r6: 24px;
  --ff-r8: 32px;

  /* Rondingen */
  --ff-rond-s: 12px;
  --ff-rond-m: 18px;
  --ff-rond-l: 24px;
  --ff-rond-xl: 32px;
  --ff-rond-pil: 999px;

  /* Schaduw */
  --ff-schaduw-s: 0 2px 8px rgba(35, 32, 74, 0.08);
  --ff-schaduw-m: 0 10px 30px rgba(35, 32, 74, 0.12);
  --ff-schaduw-knop: 0 10px 24px rgba(217, 68, 47, 0.32);

  /* Beweging */
  --ff-snel: 160ms;
  --ff-normaal: 280ms;
  --ff-veer: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ff-zacht: cubic-bezier(0.22, 1, 0.36, 1);

  /* Minimale klikmaat */
  --ff-tik: 44px;
}

/* FamilyFlow — componenten. Alleen tokens uit tokens.css gebruiken. */

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--ff-grond);
  color: var(--ff-tekst);
  font-family: var(--ff-font-tekst);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--ff-koraal-knop); outline-offset: 2px; }
p { margin: 0; }

/* ---------- App-kader ---------- */
.ff-app {
  min-height: 100%;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(108px + env(safe-area-inset-bottom, 0px));
}
.ff-theme-kind { background: var(--ff-grond); }
.ff-theme-ouder { background: var(--ff-grond); }
.ff-loading { min-height: 100vh; }
.ff-screen { display: flex; flex-direction: column; gap: var(--ff-r4); }

/* ---------- Typografie ---------- */
.ff-h1 { margin: 0; font-family: var(--ff-font-speels); font-weight: 600; font-size: var(--ff-t-xl); line-height: 1.1; letter-spacing: -0.01em; text-wrap: balance; }
.ff-h2 { margin: 0; font-family: var(--ff-font-speels); font-weight: 600; font-size: 1.35rem; line-height: 1.15; text-wrap: balance; }
.ff-eyebrow { font-size: var(--ff-t-xs); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ff-tekst-zacht); }
.ff-small { font-size: var(--ff-t-s); }
.ff-muted { color: var(--ff-tekst-zacht); }
.ff-strong { font-weight: 800; }
.ff-center { text-align: center; justify-self: center; align-self: center; }
.ff-center-row { justify-content: center; }
.ff-push { margin-left: auto; }
.ff-row { display: flex; gap: var(--ff-r3); align-items: center; flex-wrap: wrap; }
.ff-stack { display: grid; gap: var(--ff-r4); }
.ff-stack-s { display: grid; gap: var(--ff-r2); }
.ff-grow { flex: 1; }

/* ---------- Kop ---------- */
.ff-top { display: flex; align-items: center; justify-content: space-between; gap: var(--ff-r3); }
.ff-who {
  width: 52px; height: 52px; border-radius: 50%; border: 0; padding: 0;
  background: var(--ff-vlak); box-shadow: var(--ff-schaduw-s);
  display: grid; place-items: center; overflow: hidden; flex: none;
}
.ff-iconbtn {
  width: var(--ff-tik); height: var(--ff-tik); border-radius: 50%; border: 0;
  background: var(--ff-vlak); display: grid; place-items: center; box-shadow: var(--ff-schaduw-s);
}

/* ---------- Knoppen ---------- */
.ff-btn {
  min-height: var(--ff-tik); border: 0; border-radius: var(--ff-rond-m);
  padding: 11px 16px; font-weight: 800; font-size: var(--ff-t-m);
  display: inline-flex; align-items: center; justify-content: center; gap: var(--ff-r2);
  transition: transform var(--ff-snel) var(--ff-zacht), box-shadow var(--ff-snel);
}
.ff-btn:active { transform: scale(0.97); }
.ff-btn-primary, a.ff-btn-primary { background: var(--ff-koraal-knop); color: #fff; box-shadow: var(--ff-schaduw-knop); }
.ff-btn-dark, a.ff-btn-dark { background: var(--ff-nacht); color: #fff; }
.ff-btn-ghost { background: transparent; border: 2px solid var(--ff-nacht); }
.ff-btn-wide { width: 100%; }
.ff-link {
  border: 0; background: none; padding: 10px 0; min-height: var(--ff-tik);
  font-weight: 800; color: var(--ff-koraal-knop); text-decoration: underline; text-underline-offset: 3px;
}

/* ---------- Huiskamer ---------- */
.ff-room {
  --wall: #ffe9da; --sky: #cfe0ff; --sun: #ffd36a; --floor: #f6d3bc; --sofa: #ffc2b5; --lamp-glow: 0;
  position: relative; height: 410px; border-radius: var(--ff-rond-xl); overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(35, 32, 74, 0.04);
}
.ff-room-avond { --wall: #ffdccc; --sky: #ffb38a; --sun: #ff7a59; --floor: #f1c6ab; --lamp-glow: 1; }
.ff-room-nacht { --wall: #dcd6f0; --sky: #2c2957; --sun: #f4f1ff; --floor: #c9bfe0; --sofa: #e7a99c; --lamp-glow: 1; }
.ff-room > div { position: absolute; }
.ff-room-wall { inset: 0; background: var(--wall); transition: background 1s; }
.ff-room-window { left: 6%; top: 20px; width: 34%; height: 98px; border: 7px solid #fff; border-radius: 18px; overflow: hidden; background: var(--sky); }
.ff-room-window::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 6px; margin-left: -3px; background: #fff; }
.ff-room-sky { position: absolute; inset: 0; background: var(--sky); }
.ff-room-sun { position: absolute; right: 16%; top: 18%; width: 26px; height: 26px; border-radius: 50%; background: var(--sun); }
.ff-room-nacht .ff-room-sun { width: 18px; height: 18px; box-shadow: -14px 22px 0 -7px #fff, 18px 34px 0 -8px #fff; }
.ff-room-frame { left: 46%; top: 30px; width: 54px; height: 42px; border-radius: 8px; background: var(--ff-munt); border: 5px solid #fff; transform: rotate(-3deg); }
.ff-room-lamp { right: 7%; top: 0; width: 70px; height: 150px; }
.ff-room-shade { position: absolute; left: 6px; top: 22px; width: 58px; height: 32px; border-radius: 30px 30px 6px 6px; background: var(--ff-zon); }
.ff-room-shade::after {
  content: ""; position: absolute; left: -40px; right: -40px; top: 26px; height: 140px;
  background: radial-gradient(closest-side, rgba(255, 210, 120, 0.55), rgba(255, 210, 120, 0));
  opacity: var(--lamp-glow); transition: opacity 1s;
}
.ff-room-pole { position: absolute; left: 33px; top: 0; width: 4px; height: 24px; background: #e2b48f; }
.ff-room-floor { left: 0; right: 0; bottom: 0; height: 30%; background: var(--floor); }
.ff-room-sofa { left: 5%; right: 5%; bottom: 22%; height: 74px; border-radius: 30px 30px 14px 14px; background: var(--sofa); }
.ff-room-rug { left: 18%; right: 18%; bottom: 4%; height: 30px; border-radius: 50%; background: rgba(255, 255, 255, 0.45); }
.ff-room-plant { left: 3%; bottom: 16%; width: 46px; height: 90px; z-index: 1; }
.ff-room-pot { position: absolute; left: 8px; bottom: 0; width: 30px; height: 30px; border-radius: 6px 6px 12px 12px; background: var(--ff-koraal); }
.ff-room-leaf { position: absolute; width: 22px; height: 40px; border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%; background: #2fae8b; bottom: 26px; transform-origin: bottom center; }
.ff-room-leaf.a { left: 4px; transform: rotate(-24deg); }
.ff-room-leaf.b { left: 12px; height: 50px; }
.ff-room-leaf.c { left: 20px; transform: rotate(24deg); }

.ff-slot {
  position: absolute; transform: translateX(-50%); z-index: 2;
  border: 0; background: none; padding: 0;
  display: flex; flex-direction: column; align-items: center;
  border-radius: var(--ff-rond-l);
  transition: transform var(--ff-normaal) var(--ff-veer);
}
.ff-slot:active { transform: translateX(-50%) scale(0.96); }
.ff-slot-achter { top: 34px; }
.ff-slot-voor { top: 186px; z-index: 3; }
.ff-tag {
  margin-top: -22px; position: relative; z-index: 2;
  display: grid; justify-items: center; gap: 0; white-space: nowrap; line-height: 1.2;
  background: var(--ff-vlak); border-radius: 16px; padding: 5px 12px 6px;
  font-size: var(--ff-t-s); font-weight: 800; box-shadow: var(--ff-schaduw-s);
}
.ff-tag-name { display: inline-flex; align-items: center; gap: 6px; }
.ff-tag-mood { font-weight: 600; font-size: 0.74rem; color: var(--ff-tekst-zacht); }
.ff-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.ff-bubble {
  position: absolute; top: 2px; right: -6px; width: 34px; height: 34px; border-radius: 50%;
  background: var(--ff-koraal-knop); color: #fff; display: grid; place-items: center; box-shadow: var(--ff-schaduw-knop);
  animation: ff-pulse 1.8s ease-in-out infinite;
}

/* ---------- Kaarten ---------- */
.ff-card { background: var(--ff-vlak); border-radius: var(--ff-rond-l); padding: var(--ff-r4); }
.ff-attn { display: grid; gap: var(--ff-r2); animation: ff-rise var(--ff-normaal) var(--ff-zacht); }
.ff-attn-head { display: flex; align-items: center; gap: var(--ff-r2); font-size: 1.02rem; }
.ff-attn-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--tone); flex: none; }
.ff-attn-body { display: grid; gap: var(--ff-r2); color: #3f3b6b; font-size: 0.95rem; }
.ff-attn-koraal { --tone: var(--ff-koraal); }
.ff-attn-lucht { --tone: var(--ff-lucht); }
.ff-attn-zon { --tone: var(--ff-zon); }
.ff-attn-munt { --tone: var(--ff-munt); }
.ff-attn-wolk { --tone: #b9b4d6; }

.ff-mybar {
  display: flex; align-items: center; gap: var(--ff-r3);
  background: var(--ff-vlak); border-radius: var(--ff-rond-l); padding: 10px 10px 10px 14px;
}
.ff-mybar-t { flex: 1; min-width: 0; display: grid; line-height: 1.3; }

/* ---------- Navigatie onderin ---------- */
.ff-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  max-width: 480px; margin: 0 auto;
  background: var(--ff-vlak); border-top: 1px solid var(--ff-lijn);
  padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.ff-nav-item {
  position: relative; border: 0; background: none; min-height: 56px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: var(--ff-t-xs); font-weight: 700; color: var(--ff-tekst-zacht);
}
.ff-nav-item[aria-current="page"] { color: var(--ff-koraal-knop); font-weight: 800; }
.ff-soon { position: absolute; top: 2px; left: 50%; transform: translateX(4px); font-size: 0.58rem; font-weight: 800; letter-spacing: 0.04em; background: var(--ff-zon-zacht); color: #8a5a00; border-radius: var(--ff-rond-pil); padding: 1px 5px; }

/* ---------- Onderblad ---------- */
.ff-sheet-wrap { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.ff-sheet-backdrop { position: absolute; inset: 0; border: 0; background: rgba(35, 32, 74, 0.38); animation: ff-fade var(--ff-normaal); }
.ff-sheet {
  position: relative; width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
  background: var(--ff-grond); border-radius: 28px 28px 0 0;
  padding: 10px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  display: grid; gap: var(--ff-r4);
  animation: ff-up 360ms var(--ff-zacht);
}
.ff-sheet-grip { width: 44px; height: 5px; border-radius: 9px; background: #e2d6cb; justify-self: center; }

/* ---------- Check-in ---------- */
.ff-checkin-head { display: flex; align-items: center; gap: var(--ff-r3); }
.ff-checkin-av { width: 96px; height: 96px; border-radius: 50%; background: var(--ff-koraal-zacht); display: grid; place-items: center; overflow: hidden; flex: none; padding-top: 22px; }
.ff-moods { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.ff-mood {
  border: 0; background: var(--ff-vlak); border-radius: var(--ff-rond-m); padding: 10px 2px 8px;
  display: grid; justify-items: center; gap: 4px; font-size: 0.72rem; font-weight: 700; line-height: 1.2;
  transition: transform var(--ff-snel) var(--ff-veer);
}
.ff-mood:active { transform: scale(0.92); }
.ff-flo-bubble { display: flex; gap: var(--ff-r3); align-items: flex-start; }
.ff-flo-bubble p { background: var(--ff-munt-zacht); border-radius: 4px 18px 18px 18px; padding: 10px 14px; font-weight: 700; }
.ff-chips { display: flex; flex-wrap: wrap; gap: var(--ff-r2); }
.ff-chip {
  min-height: 40px; border: 1px solid #e4dcd3; background: var(--ff-vlak); border-radius: var(--ff-rond-pil);
  padding: 8px 14px; font-weight: 700; font-size: var(--ff-t-s);
}
.ff-chip[aria-pressed="true"] { background: var(--ff-nacht); border-color: var(--ff-nacht); color: #fff; }
.ff-chip-l { min-height: var(--ff-tik); font-size: var(--ff-t-m); }
.ff-chip-static { display: inline-flex; align-items: center; min-height: 32px; }

/* ---------- Gezinslid ---------- */
.ff-member { display: grid; justify-items: center; gap: var(--ff-r2); text-align: center; }
.ff-energy { width: 100%; display: grid; gap: 6px; text-align: left; margin-top: var(--ff-r2); }
.ff-bar { display: block; height: 10px; border-radius: var(--ff-rond-pil); background: #efe6dd; overflow: hidden; }
.ff-bar i { display: block; height: 100%; border-radius: inherit; background: var(--ff-zon); }
.ff-script { display: grid; gap: var(--ff-r2); }
.ff-script > div { padding-left: 12px; border-left: 3px solid #e4dcd3; }
.ff-script .ff-script-say { border-color: var(--ff-munt); }
.ff-script .ff-script-dont { border-color: var(--ff-koraal); }
.ff-who-list { display: grid; gap: var(--ff-r2); }
.ff-who-item {
  display: flex; align-items: center; gap: var(--ff-r3); text-align: left;
  border: 2px solid transparent; background: var(--ff-vlak); border-radius: var(--ff-rond-m); padding: 8px 12px;
}
.ff-who-item[aria-pressed="true"] { border-color: var(--ff-nacht); }

/* ---------- Avatar maken ---------- */
.ff-maker-stage { display: grid; place-items: center; }
.ff-maker-disc {
  width: 220px; height: 220px; border-radius: 50%; background: var(--ff-koraal-zacht);
  display: grid; place-items: center; overflow: hidden; padding-top: 34px;
  animation: ff-pop 520ms var(--ff-veer);
}
.ff-field { display: grid; gap: 6px; }
.ff-field input {
  min-height: var(--ff-tik); border: 2px solid #e4dcd3; border-radius: var(--ff-rond-m);
  padding: 10px 14px; font: inherit; font-weight: 700; background: var(--ff-vlak); color: var(--ff-tekst);
}
.ff-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; background: #f3e7dc; padding: 5px; border-radius: var(--ff-rond-m); }
.ff-tab { border: 0; background: none; min-height: 40px; border-radius: var(--ff-rond-s); font-weight: 800; font-size: var(--ff-t-s); color: var(--ff-tekst-zacht); }
.ff-tab[aria-selected="true"] { background: var(--ff-vlak); color: var(--ff-tekst); box-shadow: var(--ff-schaduw-s); }
.ff-maker-panel { display: grid; gap: var(--ff-r3); min-height: 230px; align-content: start; }
.ff-swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.ff-swatch { width: var(--ff-tik); height: var(--ff-tik); border-radius: 50%; border: 2px solid rgba(35, 32, 74, 0.08); padding: 0; }
.ff-swatch-l { width: 52px; height: 52px; }
.ff-swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ff-grond), 0 0 0 6px var(--ff-nacht); }
.ff-grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.ff-grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ff-tile {
  border: 2px solid transparent; background: var(--ff-vlak); border-radius: var(--ff-rond-m);
  padding: 8px 4px 6px; display: grid; justify-items: center; gap: 2px;
  font-size: 0.72rem; font-weight: 700; transition: transform var(--ff-snel) var(--ff-veer);
}
.ff-tile:active { transform: scale(0.94); }
.ff-tile[aria-pressed="true"] { border-color: var(--ff-nacht); background: var(--ff-zon-zacht); }
.ff-maker-actions {
  position: sticky; bottom: 0; display: flex; gap: var(--ff-r3);
  padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--ff-grond);
}

/* ---------- Melding ---------- */
.ff-toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60;
  background: var(--ff-nacht); color: #fff; font-weight: 800; padding: 12px 18px; border-radius: var(--ff-rond-pil);
  max-width: calc(100% - 32px); text-align: center; box-shadow: var(--ff-schaduw-m);
  animation: ff-rise var(--ff-normaal) var(--ff-zacht);
}

/* ---------- Avatar-beweging ---------- */
.ff-av { display: inline-block; line-height: 0; }
.ff-av-bob { animation: ff-bob var(--bob, 3.6s) ease-in-out var(--delay, 0s) infinite; }
.ff-av-breathe { animation: ff-breathe 6s ease-in-out var(--delay, 0s) infinite; transform-origin: 50% 100%; }
.ff-av-eyes { transform-box: fill-box; transform-origin: center; animation: ff-blink 5.6s var(--blink-delay, 0s) infinite; }
.ff-av-react { transform-box: fill-box; transform-origin: 50% 100%; animation: ff-react 620ms var(--ff-veer); }
.ff-av-sparkle { transform-box: fill-box; transform-origin: center; animation: ff-twinkle 2.2s ease-in-out infinite; }

@keyframes ff-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes ff-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025); } }
@keyframes ff-blink { 0%, 93%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(0.1); } }
@keyframes ff-react { 0% { transform: scale(0.94) translateY(4px); } 60% { transform: scale(1.04) translateY(-3px); } 100% { transform: none; } }

.ff-tl-dot.ff-type-aanval { background: var(--ff-koraal-knop); }
.ff-tl-dot.ff-type-wegduik { background: #9a96c0; }
.ff-tl-dot.ff-type-opkomen { background: var(--ff-munt); }
.ff-tl-dot.ff-out-opgelost { background: var(--ff-munt-donker); }
.ff-tl-dot.ff-out-half { background: var(--ff-zon); }
.ff-tl-dot.ff-out-escalatie { background: #b83521; }
.ff-whatif { display: grid; gap: 4px; padding-top: 10px; border-top: 1px solid var(--ff-lijn); }
.ff-advice { background: var(--ff-munt-zacht); }
.ff-quest-card { background: var(--ff-zon-zacht); }
.ff-quest .ff-task-check { color: #8a5a00; }
.ff-skill { gap: 6px; }
.ff-skill-n { font-weight: 600; color: var(--ff-tekst-zacht); font-size: 0.72rem; }

/* ---------- Stoplicht en coach voor nu ---------- */
.ff-licht { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; border: 2px solid transparent; background: var(--ff-vlak); border-radius: var(--ff-rond-m); padding: 12px 14px; line-height: 1.3; }
.ff-licht[aria-pressed="true"] { border-color: var(--ff-nacht); }
.ff-licht-dot { width: 22px; height: 22px; border-radius: 50%; flex: none; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.12); }
.ff-licht-rood .ff-licht-dot { background: #e5483a; }
.ff-licht-oranje .ff-licht-dot { background: #ff9f2e; }
.ff-licht-groen .ff-licht-dot { background: var(--ff-munt); }
.ff-licht-card.ff-licht-rood { background: #ffe6e2; }
.ff-licht-card.ff-licht-oranje { background: #fff1de; }
.ff-licht-card.ff-licht-groen { background: var(--ff-munt-zacht); }
.ff-coachnu-btn { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; border: 0; border-radius: var(--ff-rond-l); padding: 14px 16px; background: var(--ff-lucht-zacht); color: var(--ff-lucht-donker); line-height: 1.3; }
.ff-safe-q { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--ff-lijn); background: var(--ff-vlak); border-radius: var(--ff-rond-s); padding: 10px 12px; font-size: 0.95rem; }
.ff-safe-ja { flex: none; font-weight: 800; font-size: var(--ff-t-s); color: #b83521; background: var(--ff-koraal-zacht); border-radius: var(--ff-rond-pil); padding: 4px 12px; }
.ff-danger { background: #ffe6e2; border-left: 5px solid #b83521; }
.ff-list { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.ff-hulp { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ff-hulp-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.ff-details summary { cursor: pointer; list-style: none; min-height: 28px; }
.ff-details summary::-webkit-details-marker { display: none; }
.ff-details summary::after { content: " +"; color: var(--ff-tekst-zacht); }
.ff-details[open] summary::after { content: " −"; }
.ff-details[open] { display: grid; gap: 8px; }
.ff-question { background: var(--ff-nacht); color: #fff; }
.ff-question .ff-eyebrow { color: rgba(255,255,255,0.7); }
.ff-question .ff-btn-ghost { border-color: #fff; color: #fff; }
.ff-question .ff-btn-dark { background: #fff; color: var(--ff-nacht); }
.ff-q-big { font-family: var(--ff-font-speels); font-weight: 600; font-size: 1.35rem; line-height: 1.25; }
.ff-afspraak { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--ff-zon-zacht); border-radius: var(--ff-rond-s); font-weight: 700; font-size: 0.95rem; }
a.ff-btn-ghost { color: var(--ff-tekst); }
a.ff-btn-whatsapp { color: #fff; }

/* ---------- Eenvoudiger: twee grote knoppen, één aanrader ---------- */
.ff-two-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ff-bigbtn { border: 0; border-radius: var(--ff-rond-l); padding: 18px 12px 14px; display: grid; justify-items: center; gap: 4px; text-align: center; line-height: 1.2; min-height: 132px; align-content: center; }
.ff-bigbtn b { font-size: 1.05rem; }
.ff-bigbtn-rust { background: var(--ff-koraal-zacht); color: #b83521; }
.ff-bigbtn-ruzie { background: var(--ff-lucht-zacht); color: var(--ff-lucht-donker); }
.ff-aanrader { width: 100%; border: 0; text-align: left; display: grid; gap: 6px; background: var(--ff-nacht); color: #fff; }
.ff-aanrader .ff-eyebrow { color: rgba(255,255,255,0.75); }
.ff-aanrader .ff-btn { justify-self: start; margin-top: 4px; }
.ff-more { margin-top: 8px; }
.ff-teaser { background: var(--ff-zon-zacht); }

je met je eigen zaken!",what:"Je gaat mee in de snauw. Nu snauwen jullie allebei en wordt het een wedstrijd.",next:"a"},{type:"wegduik",text:"Zuchten, de deur hard dichtdoen en zonder tanden poetsen weggaan.",self:7,other:5,feel:"neutraal",says:"",what:"Je ontloopt de ruzie, maar je neemt je boosheid de hele ochtend mee.",next:"b"},{type:"opkomen",text:'Rustig: "Ik snap dat jij eerst was. Ik hoef alleen even mijn tanden te poetsen, twee minuten. Mag ik er even naast?"',self:4,other:4,feel:"neutraal",says:"Ja ok\xE9, ga daar maar even staan.",what:"Je ging niet in op de snauw. Daardoor had {ander} niks om tegen te vechten.",next:"c"}]},nodes:{a:{says:"Bemoei je met je eigen zaken!",feel:"boos",choices:[{type:"opkomen",text:'Een stap terug: "Ok\xE9, we hebben allebei haast. Jij nog 2 minuten, dan ik?"',self:5,other:5,feel:"neutraal",says:"Prima. 2 minuten.",end:{outcome:"half",text:"Je haalde het zelf terug. Het begin was niet fijn, maar je voorkwam erger."}},{type:"aanval",text:"Haar of zijn spullen opzij schuiven en ertussen gaan staan.",self:9,other:9,feel:"boos",says:"AU! Mam!!",end:{outcome:"escalatie",text:"Het wordt fysiek. Er moet een ouder bij komen en de dag begint voor iedereen slecht."}}]},b:{says:"H\xE9, waarom deed je vanochtend zo raar?",feel:"neutraal",text:"'s Middags zie je {ander} weer.",choices:[{type:"opkomen",text:'"Ik baalde dat je zo snauwde. Ik vroeg het gewoon normaal."',self:4,other:4,feel:"neutraal",says:"Ja, sorry. Ik was gestrest, ik was te laat.",end:{outcome:"opgelost",text:"Later praten is ook goed. Je zei wat je dwarszat, zonder aan te vallen."}},{type:"wegduik",text:'"Laat me met rust."',self:6,other:6,feel:"verdrietig",says:"Ok\xE9, dan niet.",end:{outcome:"half",text:"De ruzie ontplofte niet, maar is ook niet opgelost. Zulke kleine dingen stapelen zich op."}}]},c:{says:"Ja ok\xE9, ga daar maar even staan.",feel:"neutraal",text:"Je poetst je tanden. {ander} is nog een beetje chagrijnig.",choices:[{type:"opkomen",text:'"Thanks. Succes vandaag."',self:3,other:2,feel:"goed",says:"Jij ook. Sorry dat ik zo snauwde.",end:{outcome:"opgelost",text:"Door rustig te blijven kreeg je wat je nodig had. En {ander} zei uit zichzelf sorry."}},{type:"aanval",text:'"Zie je, het kan toch gewoon normaal."',self:4,other:6,feel:"boos",says:"Ga nou maar gewoon.",end:{outcome:"half",text:"Je deed het bijna perfect, maar dat laatste zinnetje prikte. Een sneer achteraf maakt het goede werk weer half kapot."}}]}},advice:{coach:"Als iemand snauwt, hoef je niet mee te doen. Reageer op de vraag, niet op de toon. Een snauw komt vaak door stress en is niet echt tegen jou bedoeld.",psy:"Als iemand snauwt, schiet je brein in de verdediging: vechten of vluchten. Haal \xE9\xE9n keer adem voordat je antwoordt. Dan krijgt het denkende deel van je brein weer de kans.",quest:"Reageer deze week \xE9\xE9n keer heel rustig als iemand tegen je snauwt. Vertel bij het eten hoe dat ging."}},{id:"vals-antwoord",title:"Een normale vraag, een vals antwoord",where:"thuis",with:"sib",skill:"toon",situation:"Je zit op de bank en bent moe van school. {ander} komt binnen en vraagt iets.",selfStart:5,otherStart:3,start:{says:"Heb jij mijn oplader gezien?",feel:"neutraal",choices:[{type:"aanval",text:'"Zoek het zelf, ik ben je knecht niet."',self:6,other:7,feel:"boos",says:"Wow, ik vroeg alleen iets. Wat is jouw probleem?",what:"Een normale vraag kreeg een vals antwoord. {ander} voelt zich aangevallen, terwijl er niks aan de hand was.",next:"a"},{type:"wegduik",text:"Niks zeggen en blijven scrollen.",self:5,other:5,feel:"neutraal",says:"Hallo? Ik vraag je wat.",what:"Niks zeggen voelt voor de ander ook een beetje vals.",next:"b"},{type:"opkomen",text:'"Nee, sorry. Kijk anders even in de keuken, daar lag er eentje."',self:4,other:2,feel:"goed",says:"O ja, thanks!",end:{outcome:"opgelost",text:"Een gewone vraag, een gewoon antwoord. Klaar. Zo simpel kan het zijn, ook als je moe bent."}}]},nodes:{a:{says:"Wow, ik vroeg alleen iets. Wat is jouw probleem?",feel:"boos",choices:[{type:"opkomen",text:'"Sorry, dat was vals. Ik ben gewoon moe. Ik heb hem niet gezien."',self:4,other:4,feel:"neutraal",says:"Ok\xE9. Rustig aan dan.",end:{outcome:"opgelost",text:"Je zag zelf dat je vals deed en je zei het. Dat is echt sterk."}},{type:"aanval",text:'"Jij bent mijn probleem."',self:7,other:8,feel:"verdrietig",says:"Doe normaal, joh.",end:{outcome:"escalatie",text:"Nu is er ruzie, terwijl het om een oplader ging. Zo begint het vaak: \xE9\xE9n vals zinnetje, en dan nog \xE9\xE9n."}}]},b:{says:"Hallo? Ik vraag je wat.",feel:"neutraal",choices:[{type:"opkomen",text:'"O sorry, ik zat even weg. Nee, niet gezien."',self:4,other:3,feel:"goed",says:"Ok\xE9, geeft niks.",end:{outcome:"opgelost",text:"Even laat, maar netjes. Geen ruzie."}},{type:"aanval",text:'"Ik hoorde je heus wel, ik weet het niet!"',self:6,other:6,feel:"boos",says:"Waarom doe je nou zo?",end:{outcome:"half",text:"Er is geen grote ruzie, maar de sfeer is wel verpest. Dat had makkelijk anders gekund."}}]}},advice:{coach:'Let op je toon, niet alleen op je woorden. Vraag jezelf: hoe zou ik willen dat iemand mij antwoordt? Ben je moe of chagrijnig, zeg dat dan gewoon: "Ik ben moe, ik heb hem niet gezien."',psy:"Als je moe bent of honger hebt, is je lontje korter. Je brein ziet dan sneller gevaar, ook als het er niet is. Als je weet dat je moe bent, kun je het zeggen in plaats van het op een ander af te reageren.",quest:"Let er een dag lang op: geef op elke normale vraag een normaal antwoord. Tel hoe vaak het lukt."}},{id:"iemand-doet-vals",title:"Iemand doet vals tegen jou",where:"thuis",with:"sib",skill:"grens",situation:"Je komt de kamer in met je nieuwe trui aan. {ander} kijkt je aan.",selfStart:6,otherStart:3,start:{says:"Haha, wat zie jij er stom uit.",feel:"blij",choices:[{type:"aanval",text:'"Kijk eerst eens naar jezelf, lelijkerd."',self:7,other:7,feel:"boos",says:"Wat? Het was een grapje!",what:"Je betaalt terug met hetzelfde. Nu gaat het niet meer over de trui, maar over wie het hardst kan kwetsen.",next:"a"},{type:"wegduik",text:"Niks zeggen, naar je kamer gaan en de trui uittrekken.",self:6,other:3,feel:"neutraal",says:"",what:"Je laat het gaan, maar het doet je pijn. {ander} heeft niet eens door dat het je raakte.",next:"b"},{type:"opkomen",text:'Rustig, recht aankijken: "Dat vind ik niet leuk om te horen. Ik vind hem zelf mooi."',self:4,other:4,feel:"neutraal",says:"Ok\xE9, ok\xE9, sorry. Was een grapje. Hij staat je eigenlijk best goed.",end:{outcome:"opgelost",text:"Je gaf een duidelijke grens, zonder te schelden. Dan kan de ander makkelijk sorry zeggen."}}]},nodes:{a:{says:"Wat? Het was een grapje!",feel:"boos",choices:[{type:"opkomen",text:'"Het voelde niet als een grapje. Laat het gewoon."',self:5,other:5,feel:"neutraal",says:"Ok\xE9. Sorry.",end:{outcome:"half",text:"Je herstelde het en zei waar het om ging. Het schelden had je kunnen overslaan."}},{type:"aanval",text:'"Jouw grapjes zijn net zo lelijk als jij."',self:8,other:8,feel:"boos",says:"Dan zeg ik helemaal niks meer tegen je.",end:{outcome:"escalatie",text:"Jullie hebben elkaar allebei gekwetst. Zo wordt een flauwe opmerking een ruzie van een hele dag."}}]},b:{says:"Waar is je trui? Hij was eigenlijk best mooi.",feel:"goed",text:"Later zie je {ander} weer.",choices:[{type:"opkomen",text:'"Waarom zei je dan dat ik er stom uitzag? Dat deed best pijn."',self:4,other:4,feel:"verdrietig",says:"Sorry. Dat wist ik niet. Ik zei het zonder na te denken.",end:{outcome:"opgelost",text:"Achteraf zeggen dat iets pijn deed is moedig. Nu weet {ander} het, en doet het waarschijnlijk niet meer."}},{type:"wegduik",text:'"Laat maar."',self:6,other:3,feel:"neutraal",says:"Ok\xE9.",end:{outcome:"half",text:"Je hield de pijn voor jezelf. Dan weet {ander} niet dat het je raakt, en gebeurt het waarschijnlijk weer."}}]}},advice:{coach:'Een grens aangeven is niet hetzelfde als terugslaan. Zeg wat het met je doet ("dat vind ik niet leuk") en wat je wilt ("laat dat"). Kort, rustig, en dan stoppen.',psy:"Een gemene opmerking voelt als een kleine aanval, en je brein wil terugvechten of wegrennen. Met een rustige grens laat je zien dat je sterk bent, zonder dat de ruzie groter wordt.",quest:'Geef deze week \xE9\xE9n keer rustig een grens aan: "Dat vind ik niet leuk. Wil je daarmee stoppen?"'}},{id:"zin-doordrijven",title:"Je zin doordrijven",where:"thuis",with:"sib",skill:"samen",situation:"Vrijdagavond, filmavond. Jij wilt een actiefilm, {ander} wil een comedy. Er is \xE9\xE9n tv.",selfStart:5,otherStart:5,start:{says:"Nee joh, we kijken die comedy. Jouw films zijn altijd saai.",feel:"neutraal",choices:[{type:"aanval",text:'De afstandsbediening pakken en je eigen film aanzetten. "Ik was eerst."',self:6,other:8,feel:"boos",says:"Dat is echt niet eerlijk! Mam!",what:"Je hebt je zin, maar {ander} voelt zich overruled. Nu is de filmavond voor niemand meer leuk.",next:"a"},{type:"wegduik",text:'"Prima, kijk maar wat je wilt. Ik ga wel naar boven."',self:6,other:5,feel:"verdrietig",says:"Ja, ga dan ook maar.",what:"Er is geen ruzie, maar ook geen filmavond samen. Je gaf op in plaats van samen te zoeken.",next:"b"},{type:"opkomen",text:'"Ik wil echt die actiefilm, jij die comedy. Hoe lossen we dit op? Deze week jij, volgende week ik?"',self:4,other:4,feel:"neutraal",says:"Hmm. Of we zoeken samen een derde film die we allebei ok\xE9 vinden?",what:"Je zei wat je wilde en vroeg naar een oplossing. Nu denkt {ander} met je mee in plaats van tegen je in.",next:"c"}]},nodes:{a:{says:"Dat is echt niet eerlijk! Mam!",feel:"boos",choices:[{type:"opkomen",text:'Afstandsbediening neerleggen: "Ok\xE9, sorry. Laten we om de beurt kiezen. Jij mag beginnen."',self:5,other:4,feel:"goed",says:"Echt? Ok\xE9, deal.",end:{outcome:"opgelost",text:"Je gaf iets op en kreeg er een fijne avond voor terug. Dat is samen oplossen."}},{type:"aanval",text:'"Doe niet zo kinderachtig. Ik kijk mijn film."',self:7,other:9,feel:"boos",says:"Ik haat je!",end:{outcome:"escalatie",text:"Er komt een ouder bij en de tv gaat uit. Niemand krijgt zijn zin."}}]},b:{says:"Ja, ga dan ook maar.",feel:"verdrietig",choices:[{type:"opkomen",text:'Terugkomen: "Eigenlijk wil ik wel samen kijken. Zullen we om de beurt kiezen?"',self:4,other:3,feel:"goed",says:"Ja, leuk. Dan kies jij volgende week.",end:{outcome:"opgelost",text:"Je kwam zelf terug. Daarmee laat je zien dat de avond samen je meer waard is dan gelijk krijgen."}},{type:"wegduik",text:"Boven blijven.",self:6,other:5,feel:"verdrietig",says:"",end:{outcome:"half",text:"Geen ruzie, maar ook niks samen. Gebeurt dat vaak, dan zien jullie elkaar steeds minder."}}]},c:{says:"Hmm. Of we zoeken samen een derde film die we allebei ok\xE9 vinden?",feel:"neutraal",choices:[{type:"opkomen",text:'"Goed plan. Jij noemt er drie, ik kies er \xE9\xE9n."',self:3,other:2,feel:"blij",says:"Deal! Ik pak de chips.",end:{outcome:"opgelost",text:"Jullie vonden samen iets. Niemand won, en toch hebben jullie allebei een goede avond."}},{type:"aanval",text:'"Nee, dan wil ik toch die van mij."',self:5,other:7,feel:"boos",says:"Zie je, jij wilt altijd je zin.",end:{outcome:"half",text:"Je was er bijna. Door toch vast te houden aan je eigen plan ging de goede start weer verloren."}}]}},advice:{coach:"Koppig zijn voelt als winnen, maar vaak verliezen jullie allebei. Gebruik drie stappen: 1. zeg wat jij wilt, 2. vraag wat de ander wil, 3. zoek iets waar jullie allebei mee kunnen leven.",psy:"Je zin doordrijven geeft even een gevoel van controle. Maar de ander onthoudt dat het oneerlijk was, en de volgende keer wordt het juist moeilijker. Wie kan geven en nemen, heeft op de lange termijn betere vriendschappen.",quest:"Los deze week \xE9\xE9n keer samen iets op met de drie stappen: wat wil ik, wat wil jij, wat doen we?"}},{id:"niet-luisteren",title:"Niet luisteren naar advies",where:"thuis",with:"ouder",skill:"luisteren",situation:"Vrijdag heb je een toets. Het is dinsdag. {ander} komt je kamer in.",selfStart:5,otherStart:4,start:{says:"Je hebt vrijdag die toets, h\xE8? Begin je vandaag al een stukje?",feel:"neutraal",choices:[{type:"aanval",text:'"Bemoei je er niet mee, ik weet zelf wel wanneer ik moet leren!"',self:7,other:6,feel:"verdrietig",says:"Ik probeer je alleen maar te helpen.",what:"{ander} wilde helpen, maar voelt zich weggeduwd. En jij voelt je gecontroleerd.",next:"a"},{type:"wegduik",text:'"Ja, ja." En niks doen.',self:5,other:5,feel:"neutraal",says:"Je zegt ja, maar ik zie je niks doen.",what:'"Ja ja" klinkt als luisteren, maar is het niet. De ander merkt dat meteen.',next:"b"},{type:"opkomen",text:'"Je bedoelt dat ik niet alles op donderdag moet doen, toch? Ik wil eerst even chillen. Om 7 uur begin ik, 20 minuten."',self:4,other:2,feel:"goed",says:"Precies. Goed plan. Zal ik je om 7 uur even herinneren?",end:{outcome:"opgelost",text:"Je vatte samen wat {ander} bedoelde en kwam met je eigen plan. Zo luister je \xE9n hou je zelf de regie."}}]},nodes:{a:{says:"Ik probeer je alleen maar te helpen.",feel:"verdrietig",choices:[{type:"opkomen",text:'"Sorry. Ik voel me een beetje opgejaagd. Ik ga vanavond om 7 uur 20 minuten leren, ok\xE9?"',self:4,other:3,feel:"goed",says:"Ok\xE9, dat is helemaal goed.",end:{outcome:"opgelost",text:"Je zei eerlijk hoe het voelde en kwam met een plan. Daar kan {ander} prima mee leven."}},{type:"aanval",text:'"Ik heb je hulp niet nodig."',self:7,other:6,feel:"verdrietig",says:"Ok\xE9. Dan moet je het zelf weten.",end:{outcome:"escalatie",text:"Donderdagavond zit je in de stress, met alles tegelijk. En je hebt geen zin meer om hulp te vragen."}}]},b:{says:"Je zegt ja, maar ik zie je niks doen.",feel:"neutraal",choices:[{type:"opkomen",text:'"Je hebt gelijk. Ik heb gewoon geen zin. Wil je helpen het in stukjes te verdelen?"',self:4,other:2,feel:"blij",says:"Graag! Vier avondjes van 20 minuten, dat is zo gedaan.",end:{outcome:"opgelost",text:"Eerlijk zeggen dat je geen zin hebt, en dan hulp vragen. Zo maak je van een grote klus kleine stukjes."}},{type:"wegduik",text:'"Ik doe het straks wel."',self:6,other:6,feel:"boos",says:"Dat zei je gisteren ook.",end:{outcome:"half",text:'Er komt geen grote ruzie, maar {ander} vertrouwt je "straks" niet meer. En de toets komt steeds dichterbij.'}}]}},advice:{coach:'Luisteren betekent niet dat je het overal mee eens moet zijn. Vat eerst samen wat de ander bedoelt ("Je bedoelt dat\u2026"). Dan voelt de ander zich gehoord, en mag jij je eigen plan noemen.',psy:"Op jouw leeftijd wil je zelf beslissen, en dat is gezond. Daardoor voelt advies al snel als een bevel. Als je samenvat wat de ander zegt, verdwijnt dat verzet: je kiest dan zelf, in plaats van dat je moet.",quest:'Vat deze week twee keer samen wat iemand zegt voordat je antwoordt: "Dus jij bedoelt\u2026"'}},{id:"groepsapp",title:"Een nare foto in de groepsapp",where:"online",with:"vriend",otherName:"Sem",skill:"hulp",situation:"In de klassengroepsapp zet {ander} een foto van jou waarop je raar kijkt. Er komen lachende emoji's onder.",selfStart:7,otherStart:3,start:{says:"\u{1F602}\u{1F602} Wat een kop!",feel:"blij",choices:[{type:"aanval",text:'Terugschelden in de groep: "Jij bent zelf een loser, dat weet iedereen."',self:8,other:7,feel:"boos",says:"Haha, kan er iemand niet tegen een grapje?",what:"Je reageert in de groep, waar iedereen meekijkt. Zo geef je {ander} precies de aandacht die hij zocht.",next:"a"},{type:"wegduik",text:"De telefoon wegleggen en tegen niemand iets zeggen.",self:7,other:3,feel:"goed",says:"",what:"Niet reageren in de groep is soms slim. Maar nu blijf je er alleen mee zitten.",next:"b"},{type:"opkomen",text:'Een screenshot maken. Priv\xE9 sturen: "Haal die foto weg, ik vind dat niet leuk." En het thuis of aan je mentor laten zien.',self:5,other:4,feel:"neutraal",says:"Ok\xE9, relax. Ik haal hem weg.",end:{outcome:"opgelost",text:"Niet in de groep, wel duidelijk, en je droeg het niet alleen. Een volwassene inschakelen is geen klikken. Het is slim."}}]},nodes:{a:{says:"Haha, kan er iemand niet tegen een grapje?",feel:"blij",choices:[{type:"opkomen",text:"Stoppen in de groep, een screenshot maken en het thuis vertellen.",self:6,other:4,feel:"neutraal",says:"",end:{outcome:"half",text:"Je stopte op tijd en vroeg hulp. Je ouder of mentor kan zorgen dat de foto weggaat."}},{type:"aanval",text:"Nog harder terugschelden.",self:9,other:8,feel:"boos",says:"Kijk eens wie er boos wordt \u{1F602}",end:{outcome:"escalatie",text:"Het wordt een rel in de groep. Straks gaat het niet meer over de foto, maar over wat jij schreef."}}]},b:{says:"",feel:"neutraal",text:"'s Avonds kun je niet slapen. Je blijft aan de foto denken.",choices:[{type:"opkomen",text:'Naar je ouder gaan: "Er staat een foto van mij in de groep. Ik vind het echt rot."',self:4,other:3,feel:"neutraal",says:"",end:{outcome:"opgelost",text:"Hulp vragen is moedig. Samen kunnen jullie zorgen dat de foto weggaat."}},{type:"wegduik",text:"Het voor je houden.",self:8,other:3,feel:"goed",says:"",end:{outcome:"half",text:"Niemand weet hoe rot je je voelt. Juist bij nare dingen online is het belangrijk om het niet alleen te dragen."}}]}},advice:{coach:"Online voelt alles groter, omdat iedereen meekijkt. Reageer nooit in de groep als je boos bent. Maak een screenshot, zeg het priv\xE9, of laat een volwassene het oplossen.",psy:"Wie pest, zoekt vaak de aandacht van de groep. Een boze reactie in de groep geeft precies die aandacht. Hulp vragen is geen zwakte: wie hulp vraagt, komt er sneller en met minder schade uit.",quest:"Spreek met je ouders af wat je doet als er online iets naars gebeurt. Zet het in je rustplan.",safety:"Gaat het om een naaktfoto, chantage of iemand die dreigt? Dat is geen gewone ruzie. Stuur niks door, vertel het meteen aan een volwassene en kijk op helpwanted.nl. Het is nooit jouw schuld."}},{id:"voetbal",title:"Ruzie bij het voetballen",where:"buiten",with:"vriend",otherName:"Daan",skill:"timeout",situation:"Je voetbalt met vrienden op het veldje. Je schiet, en volgens jou is het goal. {ander} zegt van niet.",selfStart:7,otherStart:6,start:{says:"Nee joh, die was naast. Jij speelt altijd vals.",feel:"boos",choices:[{type:"aanval",text:'"Hij was er WEL in! Jij bent gewoon een slechte verliezer!"',self:8,other:8,feel:"boos",says:"Ik? Jij bent de valsspeler!",what:"Jullie gaan allebei harder praten. Niemand luistert meer, iedereen wil alleen nog gelijk hebben.",next:"a"},{type:"wegduik",text:"De bal pakken en naar huis gaan.",self:7,other:6,feel:"boos",says:"Serieus? Nu kunnen we niet meer spelen.",what:"Je stopt de ruzie, maar ook het spel. Voor iedereen.",next:"b"},{type:"opkomen",text:'"Ok\xE9, we zien het allebei anders. Doen we hem over, of tossen we erom?"',self:5,other:4,feel:"neutraal",says:"Prima. Overdoen.",end:{outcome:"opgelost",text:"Bij ja-nee is er geen winnaar. Een eerlijke manier kiezen, zoals overdoen of tossen, haalt de angel eruit."}}]},nodes:{a:{says:"Ik? Jij bent de valsspeler!",feel:"boos",choices:[{type:"opkomen",text:'Time-out: "Wacht. We worden allebei te boos. Even drinken, dan verder?"',self:5,other:5,feel:"neutraal",says:"Ok\xE9. Even pauze.",end:{outcome:"half",text:"De time-out voorkwam dat het uit de hand liep. Na de pauze spreek je makkelijker af: overdoen."}},{type:"aanval",text:"Duwen.",self:10,other:9,feel:"boos",says:"Blijf van me af!",end:{outcome:"escalatie",text:"Het wordt fysiek. Het spel is voorbij, en de vriendschap misschien ook even. Duwen maakt het altijd groter."}}]},b:{says:"Serieus? Nu kunnen we niet meer spelen.",feel:"boos",choices:[{type:"opkomen",text:'Terugkomen: "Sorry, ik was boos. Doen we hem over?"',self:4,other:3,feel:"goed",says:"Ja, kom op.",end:{outcome:"opgelost",text:"Even weglopen en dan terugkomen is eigenlijk een time-out. En sorry zeggen maakt het helemaal goed."}},{type:"wegduik",text:"Gewoon naar huis gaan.",self:7,other:6,feel:"boos",says:"",end:{outcome:"half",text:"Je ontliep de ruzie, maar thuis ben je nog steeds boos. En morgen is het ongemakkelijk."}}]}},advice:{coach:'Merk je dat je te boos
